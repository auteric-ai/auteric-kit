[project]
name = "auteric-merchant"
version = "0.1.0"
description = "Merchant-side SDK for the Auteric Merchant Execution Protocol (MEP/1): validation, auth, idempotency, dispatch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "cryptography>=44,<47",
]

[project.optional-dependencies]
fastapi = ["fastapi>=0.115"]
django = ["django>=4.2"]
sidecar = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]
postgres = ["psycopg[binary]>=3.2,<4"]
test = [
  "pytest>=8.3",
  "httpx>=0.27",
  "uvicorn>=0.30",
  "fastapi>=0.115",
  "django>=4.2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project.scripts]
auteric-sidecar = "auteric_merchant.sidecar_app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
