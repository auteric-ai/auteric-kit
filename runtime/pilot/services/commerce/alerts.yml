groups:
  - name: auteric-gateway
    rules:
      - alert: AutericUncertainActions
        expr: auteric_uncertain_jobs > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Gateway has unconfirmed connector jobs; inspect receipts before any retry
      - alert: AutericConnectorOffline
        expr: auteric_stale_connectors > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: An enabled merchant connector has stopped reporting heartbeat
      - alert: AutericGatewayErrors
        expr: sum(auteric_requests_last_5m{status=~"5.."}) > 5
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: Gateway server errors increased in the last five minutes
