[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "auteric-commerce-starter"
version = "0.2.0"
description = "Commerce-aware authorization and security runtime for agent backends (vendored canonical copy; see docs/commerce/source-map.md)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.9,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
auteric = "auteric_commerce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
auteric_commerce = ["static/*.html", "static/*.css", "static/*.js"]
