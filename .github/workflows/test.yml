name: Validate Auteric Kit
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verify.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/package-openai-skills.py
