name: Validate Auteric Kit
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-verify.txt
      - run: python -m pip install -e runtime/sdk
      - run: python -m pip install pytest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run test:package
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q tests
      - run: python scripts/package-openai-skills.py
